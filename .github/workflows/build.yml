name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download Vazirmatn font (OFL)
        run: |
          mkdir -p app/src/main/assets/fonts
          for f in Regular Bold; do
            if [ ! -f "app/src/main/assets/fonts/Vazirmatn-$f.ttf" ]; then
              curl -fsSL -o "app/src/main/assets/fonts/Vazirmatn-$f.ttf" \
                "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-$f.ttf" \
                || echo "::warning::دانلود فونت $f ناموفق بود؛ اپ با فونت سیستم ساخته می‌شود."
            fi
          done

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PASS="$SECRET_KEYSTORE_PASSWORD"
            ALIAS="${SECRET_KEY_ALIAS:-mylibrary}"
            KPASS="${SECRET_KEY_PASSWORD:-$SECRET_KEYSTORE_PASSWORD}"
            echo "Using keystore from GitHub Secrets"
          else
            PASS="$(openssl rand -hex 16)"
            ALIAS="mylibrary"
            KPASS="$PASS"
            keytool -genkeypair -v -keystore "$KS" -storetype JKS \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$KPASS" \
              -dname "CN=MyLibrary, O=MyLibrary, C=IR"
            echo "::warning::کلید موقت ساخته شد. برای به‌روزرسانی روی نسخه نصب‌شده، Secrets را تنظیم کنید (README)."
          fi
          echo "::add-mask::$PASS"
          echo "::add-mask::$KPASS"
          {
            echo "KEYSTORE_PATH=$KS"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KPASS"
          } >> "$GITHUB_ENV"

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release + debug APK
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/MyLibrary-release.apk"
          cp app/build/outputs/apk/debug/*.apk "dist/MyLibrary-debug.apk"
          ls -la dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyLibrary-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
